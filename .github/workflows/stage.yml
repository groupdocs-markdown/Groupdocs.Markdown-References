name: publish-stage

# Syncs this repo into reference.groupdocs.com at content/sites/groupdocs/markdown/ on
# `main` — the site's single deploy branch.
#
# The commit message carries [deploy-qa], so the site deploys it to STAGING only
# (reference2.groupdocs.com). To publish it live, run the PromoteToProduction workflow.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        path: ./src

    - name: Checkout destination repository
      uses: actions/checkout@v4
      with:
        repository: groupdocs/reference.groupdocs.com
        path: ./dest
        ref: main
        token: ${{ secrets.REPO_TOKEN }}
        fetch-depth: 1

    - name: Sync files to destination (exclude LICENSE, README.md, .github, .git)
      run: |
        rsync -av --delete \
          --exclude 'LICENSE' \
          --exclude 'README.md' \
          --exclude '.github/' \
          --exclude '.git/' \
          ./src/ ./dest/content/sites/groupdocs/markdown/

    - name: Commit and push changes
      working-directory: ./dest
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        git commit -m "chore: sync markdown files from source repo [deploy-qa]"
        git push origin main
